<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Смакота - Меню</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ── Design System ── */
        :root {
            --page-bg: #ffffff;
            --card-bg: #ffffff;
            --section-alt: #faf8f5;
            --text-primary: #171717;
            --text-secondary: #6b6b6b;
            --brand-orange: #f65e07;
            --brand-gradient: linear-gradient(135deg, #f65e07 0%, #ff8a00 100%);
            --orange-light: rgba(246, 94, 7, 0.08);
            --border: 1px solid rgba(0, 0, 0, 0.08);
            --card-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --font: 'Outfit', sans-serif;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--page-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Header (no brand text) ── */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--page-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-cart-btn {
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            margin: -8px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .header-cart-btn:active {
            opacity: 0.6;
        }

        .header-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            background: var(--brand-gradient);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            line-height: 1;
            box-shadow: 0 1px 4px rgba(246,94,7,0.4);
        }

        .header-badge.visible {
            display: flex;
        }

        .header-total {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        /* ── Categories ── */
        .categories-wrap {
            background: var(--section-alt);
            padding: 8px 0;
        }

        .categories {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 4px 16px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            flex-shrink: 0;
            padding: 8px 18px;
            background: #f0eeeb;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s var(--ease);
            color: var(--text-secondary);
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            letter-spacing: -0.01em;
        }

        .category-chip:active {
            transform: scale(0.96);
        }

        .category-chip.active {
            background: var(--brand-gradient);
            color: #fff;
            box-shadow: 0 4px 12px rgba(246, 94, 7, 0.3);
        }

        /* ── Menu Grid ── */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
            padding-bottom: 110px;
            max-width: 640px;
            margin: 0 auto;
        }

        /* ── Card ── */
        .card {
            background: var(--card-bg);
            border: var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s var(--ease);
            cursor: default;
        }

        .card:active {
            transform: scale(0.97);
        }

        /* Image wrapper for add-btn positioning */
        .card-img-wrap {
            position: relative;
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            overflow: hidden;
            background: var(--section-alt);
        }

        .card-img-wrap img {
            width: 100%;
            aspect-ratio: 5 / 4;
            object-fit: cover;
            display: block;
        }

        /* ── Floating Add Button ── */
        .add-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--brand-gradient);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(246,94,7,0.35);
            transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            padding: 0;
        }

        .add-btn::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
        }

        .add-btn:active {
            transform: scale(0.88);
            box-shadow: 0 1px 4px rgba(246,94,7,0.25);
        }

        /* ── Card Body ── */
        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .card-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
        }

        .card-price {
            font-size: 16px;
            font-weight: 600;
            color: var(--brand-orange);
            margin: 0;
            letter-spacing: -0.01em;
        }

        /* ── Cart Floating Bar ── */
        .cart-bar {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: #1a1a1a;
            color: #fff;
            padding: 14px 20px;
            border-radius: var(--radius-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
            transform: translateY(120px);
            transition: transform 0.45s var(--ease);
            z-index: 500;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .cart-bar.visible {
            transform: translateY(0);
        }

        .cart-bar:active {
            transform: translateY(0) scale(0.98);
        }

        .cart-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-bar-count {
            background: var(--brand-gradient);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            min-width: 22px;
            height: 22px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            line-height: 1;
        }

        .cart-bar-label {
            color: rgba(255,255,255,0.8);
        }

        .cart-bar-total {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.01em;
        }

        /* ── Cart Overlay ── */
        #cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.35s var(--ease);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        /* ── Cart Modal (Bottom Sheet) ── */
        #cart-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            z-index: 1001;
            padding: 24px 20px 32px;
            transform: translateY(100%);
            transition: transform 0.4s var(--ease);
            max-height: 85vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .cart-modal-handle {
            width: 32px;
            height: 4px;
            border-radius: 2px;
            background: rgba(0,0,0,0.10);
            margin: 0 auto 20px;
        }

        .cart-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .cart-modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .cart-modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 6px;
            margin: -6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .cart-modal-close:active {
            background: var(--orange-light);
        }

        /* ── Cart Item ── */
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        .cart-item:last-of-type {
            border-bottom: none;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
            margin-right: 12px;
        }

        .cart-item-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            margin: 0 0 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cart-item-price {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* ── Quantity Controls ── */
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f4f4f4;
            padding: 4px 8px;
            border-radius: 100px;
            flex-shrink: 0;
        }

        .qty-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--brand-orange);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .qty-btn:active {
            background: var(--orange-light);
        }

        .qty-num {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
            min-width: 20px;
            text-align: center;
        }

        .empty-cart {
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
            padding: 32px 0;
        }

        /* ── Cart Summary + Checkout ── */
        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,0,0,0.06);
        }

        .cart-summary-label {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .cart-summary-total {
            font-size: 20px;
            font-weight: 700;
            color: var(--brand-orange);
            letter-spacing: -0.02em;
        }

        .checkout-btn {
            width: 100%;
            background: var(--brand-gradient);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 16px;
            margin-top: 16px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(246, 94, 7, 0.3);
            transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
            letter-spacing: 0.02em;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .checkout-btn:active {
            transform: scale(0.98);
            box-shadow: 0 3px 10px rgba(246, 94, 7, 0.25);
        }

        /* ── Utility ── */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- ─── Header: cart icon + badge | total ─── -->
    <header class="header">
        <button class="header-cart-btn" onclick="toggleCart(true)" aria-label="Open cart">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"/>
                <circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span class="header-badge" id="header-count">0</span>
        </button>
        <span class="header-total" id="header-total">0 &#8372;</span>
    </header>

    <!-- ─── Categories ─── -->
    <div class="categories-wrap">
        <div class="categories" id="cat-list"></div>
    </div>

    <!-- ─── Menu Grid ─── -->
    <div class="menu-grid" id="menu-items"></div>

    <!-- ─── Cart Floating Bar ─── -->
    <div class="cart-bar" id="cart-bar" onclick="toggleCart(true)">
        <div class="cart-bar-left">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"/>
                <circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span class="cart-bar-count" id="cart-count">0</span>
            <span class="cart-bar-label" id="cart-label">страв</span>
        </div>
        <span class="cart-bar-total" id="cart-total">0 &#8372;</span>
    </div>

    <!-- ─── Cart Modal ─── -->
    <div id="cart-overlay" onclick="toggleCart(false)"></div>
    <div id="cart-modal">
        <div class="cart-modal-handle"></div>
        <div class="cart-modal-header">
            <span class="cart-modal-title">Мій кошик</span>
            <button class="cart-modal-close" onclick="toggleCart(false)" aria-label="Close cart">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <div id="cart-items-list"></div>
        <div class="cart-summary">
            <span class="cart-summary-label">Разом</span>
            <span class="cart-summary-total" id="modal-total">0 &#8372;</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">ОФОРМИТИ ЗАМОВЛЕННЯ</button>
    </div>

    <script src="data.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let cart = {};
        let currentCategory = 'all';

        /* ── Render Categories ── */
        function renderCategories() {
            const list = document.getElementById('cat-list');
            const cats = [{ id: 'all', name: 'Усе' }, ...menuData.categories];
            list.innerHTML = cats.map(c =>
                `<button class="category-chip ${currentCategory === c.id ? 'active' : ''}" onclick="setCategory('${c.id}')">${c.name}</button>`
            ).join('');
        }

        function setCategory(id) {
            currentCategory = id;
            renderCategories();
            renderMenu();
            tg.HapticFeedback.impactOccurred('light');
        }

        /* ── Render Menu ── */
        function renderMenu() {
            const grid = document.getElementById('menu-items');
            const items = currentCategory === 'all'
                ? menuData.items
                : menuData.items.filter(i => i.category_id === currentCategory);
            grid.innerHTML = items.map(item => {
                const safeName = item.name.replace(/'/g, "\\'");
                const placeholder = 'https://placehold.co/400x400/f65e07/ffffff?text=' +
                    encodeURIComponent(item.name.substring(0, 10));
                return `
                    <div class="card">
                        <div class="card-img-wrap">
                            <img src="${item.image_url}" onerror="this.src='${placeholder}'" loading="lazy" alt="${item.name}">
                            <button class="add-btn" onclick="addToCart(${item.id},'${safeName}',${item.price})" aria-label="Add ${item.name}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                            </button>
                        </div>
                        <div class="card-body">
                            <p class="card-title">${item.name}</p>
                            <p class="card-price">${item.price} &#8372;</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* ── Cart Logic ── */
        function addToCart(id, name, price) {
            if (!cart[id]) cart[id] = { count: 0, name, price, id };
            cart[id].count++;
            updateUI();
            tg.HapticFeedback.impactOccurred('medium');
        }

        function editQty(id, delta) {
            if (!cart[id]) return;
            cart[id].count += delta;
            if (cart[id].count <= 0) delete cart[id];
            updateUI();
            renderCartList();
            tg.HapticFeedback.impactOccurred('light');
        }

        /* ── Persistence ── */
        function saveCart() {
            localStorage.setItem('smakota_cart', JSON.stringify(cart));
        }

        function loadCart() {
            const saved = localStorage.getItem('smakota_cart');
            if (saved) {
                try { cart = JSON.parse(saved); updateUI(); } catch (e) {}
            }
        }

        /* ── Update UI (header badge, total, cart bar) ── */
        function updateUI() {
            let count = 0, total = 0;
            for (const id in cart) {
                count += cart[id].count;
                total += cart[id].count * cart[id].price;
            }

            // Header badge
            const badge = document.getElementById('header-count');
            badge.textContent = count;
            badge.classList.toggle('visible', count > 0);

            // Header total
            document.getElementById('header-total').textContent = total + ' \u20B4';

            // Cart bar
            const bar = document.getElementById('cart-bar');
            if (count > 0) {
                bar.classList.add('visible');
                document.getElementById('cart-count').textContent = count;
                document.getElementById('cart-label').textContent =
                    count === 1 ? 'страва' : (count >= 2 && count <= 4 ? 'страви' : 'страв');
                document.getElementById('cart-total').textContent = total + ' \u20B4';
            } else {
                bar.classList.remove('visible');
                toggleCart(false);
            }

            saveCart();
        }

        /* ── Toggle Cart Modal ── */
        function toggleCart(show) {
            const overlay = document.getElementById('cart-overlay');
            const modal = document.getElementById('cart-modal');
            if (show) {
                renderCartList();
                overlay.style.display = 'block';
                document.body.style.overflow = 'hidden';
                requestAnimationFrame(() => {
                    overlay.style.opacity = '1';
                    modal.style.transform = 'translateY(0)';
                });
            } else {
                overlay.style.opacity = '0';
                modal.style.transform = 'translateY(100%)';
                document.body.style.overflow = '';
                setTimeout(() => { overlay.style.display = 'none'; }, 350);
            }
        }

        /* ── Render Cart List ── */
        function renderCartList() {
            const list = document.getElementById('cart-items-list');
            let total = 0;
            let html = '';
            for (const id in cart) {
                const item = cart[id];
                total += item.count * item.price;
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <p class="cart-item-title">${item.name}</p>
                            <span class="cart-item-price">${item.price} &#8372;</span>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="editQty(${id}, -1)" aria-label="Decrease quantity">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                            <span class="qty-num">${item.count}</span>
                            <button class="qty-btn" onclick="editQty(${id}, 1)" aria-label="Increase quantity">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                        </div>
                    </div>
                `;
            }
            list.innerHTML = html || '<p class="empty-cart">Кошик порожній</p>';
            document.getElementById('modal-total').textContent = total + ' \u20B4';
        }

        /* ── Checkout ── */
        function checkout() {
            if (Object.keys(cart).length === 0) return;
            tg.HapticFeedback.notificationOccurred('success');
            tg.sendData(JSON.stringify({ action: 'webapp_order', items: cart }));
            localStorage.removeItem('smakota_cart');
            tg.close();
        }

        /* ── Boot ── */
        loadCart();
        renderCategories();
        renderMenu();
    </script>
</body>
</html>
